<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Jugadores - Fútbol Infantil</title>
  <style>
    :root {
      --primary-color: #1e3a8a;
      --accent-color: #2563eb;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --jersey-color: #ef4444;
      --jersey-number-color: #ffffff;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }

    .card {
      max-width: 500px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: var(--primary-color);
      text-align: center;
      margin-top: 0;
      font-size: 24px;
    }

    p.intro {
      font-size: 14px;
      color: #64748b;
      text-align: center;
      margin-bottom: 20px;
    }

    .section-title {
      background: var(--primary-color);
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    /* Visor Gráfico Interactivo */
    .visualizer-container {
      background: #0f172a;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .pitch {
      width: 100%;
      height: 180px;
      background: #15803d;
      border: 2px solid #ffffff;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      background-image: repeating-linear-gradient(0deg, #16a34a, #16a34a 20px, #15803d 20px, #15803d 40px);
    }

    .pitch-line-center {
      position: absolute;
      top: 50%;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.7);
    }

    .pitch-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
    }

    .player-dot {
      width: 30px;
      height: 30px;
      background: #f59e0b;
      border: 2px solid white;
      border-radius: 50%;
      position: absolute;
      transform: translate(-50%, -50%);
      transition: all 0.4s ease;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: bold;
      color: white;
    }

    .jersey-preview {
      width: 90px;
      height: 100px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .jersey-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.3));
    }

    .jersey-number {
      position: absolute;
      font-size: 26px;
      font-weight: 900;
      color: var(--jersey-number-color);
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    .photo-preview-container {
      margin-top: 10px;
      text-align: center;
      display: none;
    }

    .photo-preview-container img {
      max-width: 120px;
      max-height: 120px;
      border-radius: 8px;
      border: 2px solid var(--accent-color);
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }

    button:hover { background: #15803d; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Ficha de Registro</h2>
  <p class="intro">Ingresa la información del jugador para la temporada de fútbol infantil.</p>

  <form id="registroForm">
    <div class="section-title">1. Datos del Niño / Jugador</div>

    <div class="form-group">
      <label for="nombres">Nombre(s):</label>
      <input type="text" id="nombres" required placeholder="Ej. Mateo Jesús">
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="apellidoPaterno">Apellido Paterno:</label>
        <input type="text" id="apellidoPaterno" required placeholder="Ej. López">
      </div>
      <div class="form-group">
        <label for="apellidoMaterno">Apellido Materno:</label>
        <input type="text" id="apellidoMaterno" required placeholder="Ej. Hernández">
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="apodo">Apodo / Sobrenombre:</label>
        <input type="text" id="apodo" placeholder="Ej. El Rayo / Teo">
      </div>
      <div class="form-group">
        <label for="rama">Rama / Categoría:</label>
        <select id="rama" required>
          <option value="Varonil">Varonil</option>
          <option value="Femenil">Femenil</option>
          <option value="Mixto">Mixto</option>
        </select>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="fechaNacimiento">Fecha de Nacimiento:</label>
        <input type="date" id="fechaNacimiento" required onchange="calcularEdad()">
      </div>
      <div class="form-group">
        <label for="edad">Edad (Años):</label>
        <input type="number" id="edad" readonly placeholder="Auto">
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="dorsal">Número de Dorsal:</label>
        <input type="number" id="dorsal" placeholder="Ej. 10" min="1" max="99" required oninput="actualizarDorsalVisual()">
      </div>
      <div class="form-group">
        <label for="perfilDominante">Pie Dominante:</label>
        <select id="perfilDominante">
          <option value="Derecho">Derecho (Diestro)</option>
          <option value="Izquierdo">Izquierdo (Zurdo)</option>
          <option value="Ambidiestro">Ambidiestro</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="posicion">Posición Principal:</label>
      <select id="posicion" required onchange="actualizarPosicionCampo()">
        <option value="">Selecciona una posición</option>
        <option value="Portero">Portero</option>
        <option value="Defensa">Defensa</option>
        <option value="Mediocampista">Mediocampista</option>
        <option value="Delantero">Delantero</option>
      </select>
    </div>

    <label>Vista Previa del Jugador en Campo:</label>
    <div class="visualizer-container">
      <div class="pitch">
        <div class="pitch-line-center"></div>
        <div class="pitch-circle"></div>
        <div id="playerDot" class="player-dot" style="top: 50%; left: 50%;">?</div>
      </div>

      <div class="jersey-preview">
        <svg class="jersey-svg" viewBox="0 0 100 100">
          <path d="M 30,15 L 40,5 L 60,5 L 70,15 L 90,25 L 80,45 L 70,38 L 70,90 L 30,90 L 30,38 L 20,45 L 10,25 Z" fill="var(--jersey-color)" stroke="#ffffff" stroke-width="2"/>
        </svg>
        <div id="jerseyNumber" class="jersey-number">--</div>
      </div>
    </div>

    <div class="form-group" style="margin-top: 15px;">
      <label for="foto">Fotografía del Niño (Cámara o Galería):</label>
      <!-- Se retiró el atributo capture="user" para habilitar la selección desde Galería -->
      <input type="file" id="foto" accept="image/*" required onchange="mostrarPreviaFoto(event)">
      <div id="photoPreviewContainer" class="photo-preview-container">
        <img id="imgPreview" src="" alt="Vista previa de la fotografía">
      </div>
    </div>

    <div class="section-title">2. Datos Médicos y Talla</div>

    <div class="grid-2">
      <div class="form-group">
        <label for="tipoSangre">Tipo de Sangre:</label>
        <select id="tipoSangre">
          <option value="Desconocido">No lo sé</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
        </select>
      </div>
      <div class="form-group">
        <label for="tallaUniforme">Talla de Uniforme:</label>
        <select id="tallaUniforme">
          <option value="Talla 6">Talla 6</option>
          <option value="Talla 8">Talla 8</option>
          <option value="Talla 10">Talla 10</option>
          <option value="Talla 12">Talla 12</option>
          <option value="Talla 14">Talla 14</option>
          <option value="Talla 16">Talla 16</option>
          <option value="Talla S Adulto">Talla S Adulto</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="observaciones">Alergias / Padecimientos / Medicamentos:</label>
      <textarea id="observaciones" rows="2" placeholder="Ej. Asma, alergia a la picadura de abeja, etc."></textarea>
    </div>

    <div class="section-title">3. Datos del Padre / Tutor</div>

    <div class="form-group">
      <label for="nombrePadre">Nombre Completo del Tutor:</label>
      <input type="text" id="nombrePadre" required placeholder="Ej. Juan López Pérez">
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="contacto">Teléfono WhatsApp:</label>
        <input type="tel" id="contacto" required placeholder="Ej. 9931234567">
      </div>
      <div class="form-group">
        <label for="contactoEmergencia">Teléfono de Emergencia 2:</label>
        <input type="tel" id="contactoEmergencia" placeholder="Ej. 9937654321">
      </div>
    </div>

    <div class="form-group">
      <label for="correo">Correo Electrónico:</label>
      <input type="email" id="correo" placeholder="ejemplo@correo.com">
    </div>

    <button type="submit" id="btnEnviar">Enviar Registro</button>
  </form>

  <div id="status"></div>
</div>

<script>
  const IMGBB_API_KEY = "3fd6d6924fa3188577aca199a2eff9bf";
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJ6bCKvmOy5uhg3KRskN6NsrXfVbxlQ4qhrxcfocGMqVIBFJybyPP4V-NZDuHXdIZK/exec";

  function calcularEdad() {
    const fechaInput = document.getElementById("fechaNacimiento").value;
    if (!fechaInput) return;

    const [year, month, day] = fechaInput.split('-').map(Number);
    const hoy = new Date();
    
    let edad = hoy.getFullYear() - year;
    const mesActual = hoy.getMonth() + 1;
    const diaActual = hoy.getDate();

    if (mesActual < month || (mesActual === month && diaActual < day)) {
      edad--;
    }
    document.getElementById("edad").value = edad >= 0 ? edad : 0;
  }

  function actualizarDorsalVisual() {
    const val = document.getElementById("dorsal").value;
    document.getElementById("jerseyNumber").innerText = val ? val : "--";
  }

  function actualizarPosicionCampo() {
    const pos = document.getElementById("posicion").value;
    const dot = document.getElementById("playerDot");
    
    const coordenadas = {
      "Portero": { top: "85%", left: "50%", label: "POR" },
      "Defensa": { top: "65%", left: "50%", label: "DEF" },
      "Mediocampista": { top: "45%", left: "50%", label: "MED" },
      "Delantero": { top: "20%", left: "50%", label: "DEL" }
    };

    if (coordenadas[pos]) {
      dot.style.top = coordenadas[pos].top;
      dot.style.left = coordenadas[pos].left;
      dot.innerText = coordenadas[pos].label;
    } else {
      dot.style.top = "50%";
      dot.style.left = "50%";
      dot.innerText = "?";
    }
  }

  function mostrarPreviaFoto(event) {
    const file = event.target.files[0];
    const previewContainer = document.getElementById("photoPreviewContainer");
    const imgPreview = document.getElementById("imgPreview");

    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        imgPreview.src = e.target.result;
        previewContainer.style.display = "block";
      };
      reader.readAsDataURL(file);
    } else {
      previewContainer.style.display = "none";
    }
  }

  document.getElementById("registroForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const btn = document.getElementById("btnEnviar");
    const status = document.getElementById("status");

    btn.disabled = true;
    status.style.color = "#1e3a8a";
    status.innerText = "Subiendo foto del jugador a ImgBB...";

    try {
      const fileInput = document.getElementById("foto");
      if (!fileInput.files.length) {
        throw new Error("Por favor selecciona una fotografía.");
      }

      // 1. Subida a ImgBB
      const formData = new FormData();
      formData.append("image", fileInput.files[0]);

      const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: "POST",
        body: formData
      });

      const imgbbData = await imgbbRes.json();
      if (!imgbbData.success) {
        throw new Error("Ocurrió un error al subir la fotografía.");
      }

      const fotoUrl = imgbbData.data.url;
      status.innerText = "Guardando información en Google Sheets...";

      // 2. Envío a Google Apps Script
      const payload = {
        accion: "guardarJugador",
        nombres: document.getElementById("nombres").value,
        apellidoPaterno: document.getElementById("apellidoPaterno").value,
        apellidoMaterno: document.getElementById("apellidoMaterno").value,
        apodo: document.getElementById("apodo").value,
        rama: document.getElementById("rama").value,
        fechaNacimiento: document.getElementById("fechaNacimiento").value,
        edad: document.getElementById("edad").value,
        dorsal: document.getElementById("dorsal").value,
        perfilDominante: document.getElementById("perfilDominante").value,
        posicion: document.getElementById("posicion").value,
        tipoSangre: document.getElementById("tipoSangre").value,
        tallaUniforme: document.getElementById("tallaUniforme").value,
        observaciones: document.getElementById("observaciones").value,
        nombrePadre: document.getElementById("nombrePadre").value,
        contacto: document.getElementById("contacto").value,
        contactoEmergencia: document.getElementById("contactoEmergencia").value,
        correo: document.getElementById("correo").value,
        fotoUrl: fotoUrl
      };

      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      status.style.color = "#16a34a";
      status.innerText = "¡Registro completado con éxito!";
      document.getElementById("registroForm").reset();
      document.getElementById("photoPreviewContainer").style.display = "none";
      actualizarDorsalVisual();
      actualizarPosicionCampo();

    } catch (error) {
      console.error(error);
      status.style.color = "#dc2626";
      status.innerText = "Error: " + error.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
